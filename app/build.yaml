targets:
  $default:
    builders:
      drift_dev:
        options:
          # Datas gravadas como texto ISO-8601 (ex.: 2026-10-15T08:30:00.000),
          # o que permite agrupar por dia/hora direto no SQL com substr().
          store_date_time_values_as_text: true
      json_serializable:
        options:
          explicit_to_json: true
